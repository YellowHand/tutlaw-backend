spring:
  application:
    name: tutlaw-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/tutlaw
    username: tutlaw_user
    password: tutlaw_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080