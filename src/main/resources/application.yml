spring:
  application:
    name: tutlaw-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/tutlaw
    username: tutlaw_user
    password: tutlaw_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      cors:
        allowed-origins: "http://localhost:5173"
        allowed-methods: "GET"
app:
  jwt:
    secret: "5d8f2a9e1b4c7d0e3f6a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8d"
    access-token-expiration-ms: 900000
server:
  port: 8080