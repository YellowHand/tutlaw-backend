spring:
  application:
    name: gradus-iuris-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tutlaw}
    username: ${SPRING_DATASOURCE_USERNAME:tutlaw_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tutlaw_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
app:
  jwt:
    secret: ${APP_JWT_SECRET:lokalny-dev-sekret-min-32-znaki-zmien-koniecznie-na-produkcji}
    # Token dostępu żyje krótko (30 min); użytkownika w aplikacji utrzymuje token odświeżający.
    access-token-expiration-ms: ${APP_JWT_EXPIRATION_MS:1800000}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_DAYS:30}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  # Adres frontendu w linkach z maili o zmianie hasła (ten sam FRONTEND_URL co CORS).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  fsrs:
    request-retention: 0.9
    new-flashcards-per-day: 20
    new-test-questions-per-day: 40
    # Ile zaległych powtórek dziennie trafia do sesji (osobno fiszki i testy); reszta czeka na kolejne dni.
    max-reviews-per-day: 100
  review:
    # Od ilu błędów pytanie uchodzi za „trudne" (podpowiedź, żeby je zawiesić albo zgłosić). Niczego nie zawiesza samo.
    leech-threshold: 8
  questions:
    # Do ilu dni po wejściu w życie zmiana w prawie uchodzi za „świeżą" (kategoria „Zmiany w prawie" we własnym teście).
    recent-change-days: 365

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      cors:
        allowed-origins: ${FRONTEND_URL:http://localhost:5173}
        allowed-methods: GET

server:
  port: ${PORT:8080}
  # Za serwerem pośredniczącym (nginx, hosting) ustaw FORWARD_HEADERS_STRATEGY=native, inaczej limiter prób logowania
  # widzi adres serwera pośredniczącego zamiast klienta (wszyscy mają wtedy jeden wspólny limit). Lokalnie: none.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}